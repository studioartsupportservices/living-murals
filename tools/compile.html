<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Compile targets</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<script type="module">
  import { manifest } from '../js/pieces.js';
  import { compile } from '../js/targets.js';
  window.run = async () => {
    const m = await manifest();
    const buf = await compile(m.pieces, p => console.log('progress', Math.round(p)));
    let s = ''; const u = new Uint8Array(buf);
    for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return { b64: btoa(s), ids: m.pieces, key: `targets:${m.version}:${m.pieces.join(',')}` };
  };
  window.ready = true;
</script>
</body></html>
